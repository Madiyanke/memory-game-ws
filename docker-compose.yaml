# Docker Compose — Développement local
# Usage : docker compose up --build

services:
  memory-game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memory-game-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - app-logs:/app/logs

volumes:
  app-logs:
