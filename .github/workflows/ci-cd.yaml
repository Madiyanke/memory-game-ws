name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/memory-game

jobs:
  # ===========================================
  # JOB 1 : BUILD & PUSH IMAGE SUR DOCKERHUB
  # ===========================================
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Extraction du tag (Git SHA court)
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Connexion à DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et Push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ steps.vars.outputs.sha_short }}

  # ===========================================
  # JOB 2 : DÉPLOIEMENT SUR LE VPS
  # ===========================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # 1. Se placer dans le dossier de production
            cd /home/${{ secrets.VPS_USERNAME }}/memory-game

            # 2. Se connecter à DockerHub pour pull l'image privée (si besoin)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 3. Pull la nouvelle image
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            docker compose -f docker-compose.prod.yml pull

            # 4. Redémarrer le conteneur avec la nouvelle image
            docker compose -f docker-compose.prod.yml up -d

            # 5. Nettoyer les anciennes images inutilisées
            docker image prune -f

            # 6. Vérifier que le conteneur tourne
            sleep 5
            docker compose -f docker-compose.prod.yml ps
            echo "Déploiement réussi — tag: $IMAGE_TAG"
